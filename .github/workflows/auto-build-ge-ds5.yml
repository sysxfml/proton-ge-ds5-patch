name: Auto Build GE-Proton (DS5 Haptic)

concurrency:
  group: auto-build-ge-ds5
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-release:
    name: Check Upstream Version
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.get_upstream.outputs.tag }}
      should_build: ${{ steps.check_local.outputs.build }}
    steps:
      - name: Fetch Latest Upstream Tag
        id: get_upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Upstream latest tag is $LATEST_TAG"

      - name: Check Local Release Status
        id: check_local
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG="${{ steps.get_upstream.outputs.tag }}"
          TARGET_TAG="${LATEST_TAG}-ds5"
          CURRENT_TAG=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[] | select(.tagName | endswith("-ds5")) | .tagName' | sort -V | tail -n 1 || true)

          echo "Current generated release: ${CURRENT_TAG:-<none>}"
          echo "Latest upstream release: $LATEST_TAG"

          if [ -z "$CURRENT_TAG" ]
          then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "No DS5 release exists. Proceeding to build."
          elif [ "$CURRENT_TAG" = "$TARGET_TAG" ]
          then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Generated release is already up to date. Skipping build."
          elif [ "$(printf '%s\n%s\n' "$CURRENT_TAG" "$TARGET_TAG" | sort -V | tail -n 1)" = "$CURRENT_TAG" ]
          then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Local DS5 release is newer than or equal to upstream. Skipping build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "A newer upstream release was detected. Proceeding to build."
          fi

  build-and-publish:
    name: Build & Publish Release
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_codeql: true
          remove_docker_images: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia* /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az* /usr/local/.ghcup

      - name: Prepare host
        run: |
          sudo apt update
          sudo apt-get install -y ccache fontforge-nox

      - name: Checkout Local Repository (Patches)
        uses: actions/checkout@v4
        with:
          path: 'my-repo'

      - name: Checkout Upstream GE-Proton
        uses: actions/checkout@v4
        with:
          repository: 'GloriousEggroll/proton-ge-custom'
          ref: ${{ needs.check-release.outputs.latest_tag }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          path: 'proton-src'

      - name: Restore DS5 controller stack to GE-Proton 11.1 baseline
        working-directory: ./proton-src
        run: |
          echo "Removing newer upstream DS5 patches if they exist."
          rm -rf patches/proton-ds5-haptic

          python3 - <<'PY'
          import sys
          from pathlib import Path

          p = Path("patches/protonprep-valve-staging.sh")
          s = p.read_text(encoding="utf-8")
          start_markers = (
              "# https://github.com/xzn/proton-ds5-haptic",
              'echo "WINE: -HOTFIX- Add proton DS5 patches"',
              'proton-ds5-haptic'
          )
          end_marker = 'echo "WINE: RUN AUTOCONF TOOLS/MAKE_REQUESTS"'

          starts = [s.find(m) for m in start_markers if s.find(m) != -1]
          start = min(starts) if starts else -1
          
          if start != -1:
              end = s.find(end_marker, start)
              if end == -1:
                  print("Found upstream DS5 block start but not its end marker. Proceeding with caution.")
                  sys.exit(1)
              replacement = 'echo "WINE: DS5 legacy mode - skipping upstream proton-ds5-haptic patches"\n\n'
              p.write_text(s[:start] + replacement + s[end:], encoding="utf-8")
              print("Removed upstream proton-ds5-haptic application block.")
          else:
              print("No upstream proton-ds5-haptic application block found; assuming clean prep script.")
          PY

      - name: Inject DS5 Patches
        run: |
          cp my-repo/ds5-patches/*.patch proton-src/patches/
          PATCH_DIR="$GITHUB_WORKSPACE/my-repo/ds5-patches"
          
          > patch_list.txt
          for patch_file in $(ls "$PATCH_DIR"/*.patch | sort)
          do
            echo "patch -Np1 < \"$patch_file\"" >> patch_list.txt
          done
          
          sed -i '/#WINE CUSTOM PATCHES/r patch_list.txt' proton-src/patches/protonprep-valve-staging.sh

      - name: Patch & Prepare Submodules
        working-directory: ./proton-src
        run: |
          for attempt in {1..10}
          do
            if git submodule update --init --filter=tree:0 --recursive
            then
              break
            fi
            if [ $attempt -lt 10 ]
            then
              echo "Submodule update failed, retrying in $((attempt * 10)) seconds..."
              sleep $((attempt * 10))
            fi
          done
          ./patches/protonprep-valve-staging.sh
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          
          echo "Fixing pulse.c 11.2 hybrid compilation conflicts..."
          for f in $(find . -path "*/dlls/winepulse.drv/pulse.c")
          do
            echo "Patching orphaned 11.2 logic in $f"
            sed -i '1i #define pulse_stream_ready(s) pulse_stream_valid(s)' "$f"
            sed -i '1i #define pulse_stream_haptic(s) (0)' "$f"
            sed -i 's/static int pulse_cond_timedwait_ms/static __attribute__((unused)) int pulse_cond_timedwait_ms/' "$f"
          done
          
          mkdir ./build

      - name: Configure Build
        working-directory: ./proton-src/build
        run: |
          ../configure.sh --build-name=${{ needs.check-release.outputs.latest_tag }}-ds5 --container-engine=docker

      - name: Make Redist
        working-directory: ./proton-src/build
        run: |
          make -j$(nproc) redist

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ needs.check-release.outputs.latest_tag }}-ds5"
          ASSET="./proton-src/build/${NEW_TAG}.tar.gz"

          gh release create "$NEW_TAG" \
            "$ASSET" \
            --title "${{ needs.check-release.outputs.latest_tag }} DS5 Patch" \
            --notes "Automated build of GE-Proton (${{ needs.check-release.outputs.latest_tag }}) using the GE-Proton 11.1 DS controller baseline plus custom DualSense haptic patches." \
            --repo "${{ github.repository }}"

          echo "New release created successfully: $NEW_TAG"
